[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["ByCat <admin@bycat.one>"]
license = "MIT"

[workspace.dependencies]
monitorium-core = { path = "crates/monitorium-core" }
monitorium-platform = { path = "crates/monitorium-platform" }
crossbeam-channel = "0.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "monitorium"
description = "Control monitor brightness with DDC/CI or software dimming"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
monitorium-core.workspace = true
monitorium-platform.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.14"
tray-icon = "0.25"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
single-instance = "0.3"
simplelog = "0.12"

# eframe doesn't re-export winit's macOS event loop options
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.winresource]
ProductName = "Monitorium"
FileDescription = "Monitorium"
CompanyName = "ByCat"
LegalCopyright = "Copyright © 2026 ByCat"

[package.metadata.packager]
product-name = "Monitorium"
identifier = "com.bycat.monitorium"
publisher = "ByCat"
authors = ["ByCat <admin@bycat.one>"]
description = "Control monitor brightness with DDC/CI or software dimming"
copyright = "Copyright © 2026 ByCat"
category = "Utility"
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries = [{ path = "monitorium", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/icon.ico",
]
formats = ["nsis"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# a menu bar app without a Dock icon
background-app = true
# ad-hoc: without any signature, downloaded builds show as damaged on Apple silicon
signing-identity = "-"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/icons/icon.ico"
compression = "lzma"
appdata-paths = ["$APPDATA/Monitorium", "$LOCALAPPDATA/Monitorium"]
display-language-selector = false
